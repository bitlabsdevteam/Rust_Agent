[package]
name = "agent-in-rust"
version = "0.1.0"
edition = "2021"
default-run = "agent-in-rust"

[[bin]]
name = "agent-in-rust"
path = "src/main.rs"

[workspace]
members = ["."]

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell"]
# Supported release matrix for v5:
# - macOS Intel: x86_64-apple-darwin
# - macOS Apple Silicon: aarch64-apple-darwin
# - Linux x86_64 GNU: x86_64-unknown-linux-gnu
# - Linux ARM64 GNU: aarch64-unknown-linux-gnu
# - Windows x86_64 MSVC: x86_64-pc-windows-msvc
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"

[dependencies]
base64 = "0.22"
dotenvy = "0.15"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.4.1"
